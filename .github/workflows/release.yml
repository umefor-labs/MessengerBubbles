name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test
      - name: Build one exe
        run: >
          dotnet publish src/MessengerBubbles -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=$($env:TAG.TrimStart('v')) -o out
      - name: Publish release
        run: |
          $exe = "MessengerBubbles-$env:TAG-win-x64.exe"
          Move-Item out/MessengerBubbles.exe $exe
          # A release made on the GitHub website already exists, so only attach the file to it.
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $exe --clobber
          } else {
            gh release create $env:TAG $exe --generate-notes
          }
