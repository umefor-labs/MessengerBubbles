name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test
      # A PR's exe to try before merging; download it from the run's Artifacts.
      - name: Build test exe
        if: github.event_name == 'pull_request'
        run: >
          dotnet publish src/MessengerBubbles -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o out
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: MessengerBubbles-pr${{ github.event.pull_request.number }}-win-x64
          path: out/MessengerBubbles.exe
          retention-days: 14
