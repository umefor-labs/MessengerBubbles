<script>
// Every property is a pure function of t, so any frame renders on its own.
function bezier(x1, y1, x2, y2) {
  const f = (a, b, s) => 3 * a * s * (1 - s) ** 2 + 3 * b * s * s * (1 - s) + s ** 3;
  return x => {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    let lo = 0, hi = 1;
    for (let i = 0; i < 24; i++) {
      const m = (lo + hi) / 2;
      if (f(x1, x2, m) < x) lo = m; else hi = m;
    }
    return f(y1, y2, (lo + hi) / 2);
  };
}
const OUT = bezier(.23, 1, .32, 1), IO = bezier(.77, 0, .175, 1), LIN = x => x;
const prog = (t, a, b, e = OUT) => e(Math.min(1, Math.max(0, (t - a) / (b - a))));
function kf(t, keys, e = IO) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i][0]) return keys[i - 1][1] + (keys[i][1] - keys[i - 1][1]) * prog(t, keys[i - 1][0], keys[i][0], e);
  }
  return keys[keys.length - 1][1];
}
// Fades in at a, out at b.
const span = (t, a, b, f = .2) => prog(t, a, a + f) * (1 - prog(t, b - f, b, LIN));
const el = (html, cls = 'abs') => {
  const d = document.createElement('div');
  d.className = cls;
  d.innerHTML = html;
  document.getElementById('host').appendChild(d);
  return d;
};
const put = (e, x, y, s = 1, o = 1, z) => {
  e.style.transform = `translate(${x}px,${y}px) scale(${s})`;
  e.style.opacity = o;
  e.style.visibility = o <= .001 ? 'hidden' : 'visible';
  if (z !== undefined) e.style.zIndex = z;
};

const P = {

};

const bubble = p => el(`<div class="face" style="background:${P[p][2]}">${P[p][1]}</div><div class="badge"></div>`, 'abs bubble');

function layoutChips() {
  [[0, 1, 2], [3, 4, 5]].forEach((line, row) => {
    const widths = line.map(i => document.getElementById('c' + i).offsetWidth);
    let x = (1920 - widths.reduce((a, b) => a + b, 0) - 24 * 2) / 2;

      c.dataset.x = x;
      c.dataset.y = 420 + row * 94;
      x += widths[k] + 24;

}

const CAPTIONS = [
  [3.8, 10.9, 'Có tin là bật bóng', 'Mỗi người một bóng, bóng mới nằm trên bóng cũ.'],
  [11.1, 15.9, 'Bấm là vào thẳng cuộc chat', 'Không tải lại trang, chỉ hiện khung chat.'],
  [16.1, 18.9, 'Đang đọc thì không báo trùng', 'Cuộc chat đang mở không bật thêm thông báo.'],
  [19.1, 24.3, 'Đổi cuộc chat, bóng đổi theo', 'Rời khung ở cuộc chat nào, bóng thành của người đó.'],

  [37.8, 44.3, 'Tùy chỉnh ngay ở khay', 'Âm báo, xem trước, cỡ khung chat, tiếng Việt hoặc English.'],
];
const CURSOR_X = [[3.5,1040],[11,1040],[12,1878],[12.6,1878],[13,1600],[18.8,1600],[19.4,1294],[19.7,1294],[20.6,1500],[21.6,1500],[22.4,720],[24.4,720],[25.1,1878],[25.2,1878],[26.2,462],[26.6,462],[27.1,1878],[27.2,1878],[28.4,960],[29,960],[30,720],[33.6,720],[34.2,42],[35,42],[35.8,720],[37.5,720],[38.6,1690],[39,1690],[39.6,1620],[39.9,1620],[40.6,1280],[41.5,1280],[41.9,1690],[44.6,1690]];
const CURSOR_Y = [[3.5,720],[11,720],[12,342],[12.6,342],[13,780],[18.8,780],[19.4,218],[19.7,218],[20.6,402],[21.6,402],[22.4,640],[24.4,640],[25.1,342],[25.2,342],[26.2,582],[26.6,582],[27.1,246],[27.2,246],[28.4,903],[29,903],[30,640],[33.6,640],[34.2,582],[35,582],[35.8,640],[37.5,640],[38.6,1044],[39,1044],[39.6,812],[39.9,812],[40.6,868],[41.5,868],[41.9,1044],[44.6,1044]];

const EDGE = 1836, LANY = 300, KHOAY = 204, ANCHOR = 540, PANELX = 1254, PANELY = 168;
const BADGE = (b, n) => {

const pop = (t, a) => .4 + .6 * prog(t, a, a + .25);
const seen = (t, a) => prog(t, a, a + .12, LIN);

function setPreview(p, text, x, y, o) {
  const a = preview.querySelector('.av');

window.seek = t => {
  // Layers
  title.style.opacity = 1 - prog(t, 3.2, 3.7, LIN);
  title.style.visibility = t >= 3.7 ? 'hidden' : 'visible';
  put(document.getElementById('tIcon'), 0, 22 * (1 - prog(t, .25, .95)), .95 + .05 * prog(t, .25, .95), prog(t, .25, .8));
  put(document.getElementById('tName'), 0, 22 * (1 - prog(t, .55, 1.25)), 1, prog(t, .55, 1.1));
  put(document.getElementById('tSub'), 0, 22 * (1 - prog(t, .85, 1.55)), 1, prog(t, .85, 1.4));
  outro.style.opacity = prog(t, 44.4, 44.95, LIN);
  outro.style.visibility = t < 44.4 ? 'hidden' : 'visible';
  put(document.getElementById('oIcon'), 0, 16 * (1 - prog(t, 44.8, 45.4)), 1, prog(t, 44.8, 45.3));
  put(document.getElementById('oName'), 0, 16 * (1 - prog(t, 45, 45.6)), 1, prog(t, 45, 45.5));
  CHIPS.forEach((_, i) => {
    const c = document.getElementById('c' + i), a = 45.3 + i * .12;
    put(c, +c.dataset.x, +c.dataset.y + 16 * (1 - prog(t, a, a + .5)), 1, prog(t, a, a + .4));
  });
  put(document.getElementById('oUrl'), 0, 0, 1, prog(t, 46.3, 46.8));
  put(document.getElementById('oNote'), 0, 0, 1, prog(t, 46.6, 47.1));

  // Caption
  const cap = document.getElementById('caption');
  const cur = CAPTIONS.find(c => t >= c[0] && t < c[1]);
  if (cur) {
    cap.querySelector('.h').textContent = cur[2];
    cap.querySelector('.s').textContent = cur[3];
    const o = span(t, cur[0], cur[1], .25);
    put(cap, 96, 40 + 10 * (1 - prog(t, cur[0], cur[0] + .35)), 1, o);
  } else put(cap, 96, 40, 1, 0);

  // Lan's bubble, which becomes Vy's at 22.6
  const stackAt = (i, n) => ANCHOR + (n - 1 - i) * 6;
  const group = prog(t, 32.6, 33, IO) - prog(t, 34.4, 34.75, IO) + prog(t, 36.6, 37, IO);
  const lanX = t < 25.2 ? EDGE : kf(t, [[25.2, EDGE], [26.2, 420]], IO) * (t < 26.2 ? 1 : 0) + (t >= 26.2 ? kf(t, [[26.25, 420], [26.6, 0]], OUT) : 0);
  const lanYDrag = kf(t, [[25.2, LANY], [26.2, ANCHOR]]);
  const spreadT = prog(t, 34.4, 34.75, IO) - prog(t, 36.6, 37, IO);
  const stackLan = 552 + (372 - 552) * spreadT, stackKhoa = 546 + (456 - 546) * spreadT, stackHuy = 540;
  const lanY = t < 32.6 ? lanYDrag : t < 33 ? ANCHOR + (552 - ANCHOR) * prog(t, 32.6, 33, IO) : stackLan;
  put(bLan, lanX, lanY, pop(t, 4.2), seen(t, 4.2), 11);
  const swap = prog(t, 22.6, 22.85, LIN);
  lanFace.style.opacity = 1 - swap;
  vyFace.style.opacity = swap;
  BADGE(bLan, t < 4.2 ? 0 : t < 5.8 ? 1 : t < 12.1 ? 2 : 0);

  // Khoa's first bubble, dismissed at 28.5
  const kx = kf(t, [[27.2, EDGE], [28.4, 918]]), ky = kf(t, [[27.2, KHOAY], [28.4, 861]]);
  const suck = prog(t, 28.5, 28.72, IO);
  put(bKhoa, kx, ky, pop(t, 7.6) * (1 - .8 * suck), seen(t, 7.6) * (1 - prog(t, 28.6, 28.75, LIN)), 12);
  BADGE(bKhoa, 1);

  // Zone
  const zoneO = prog(t, 27.25, 27.45, LIN) * (1 - prog(t, 28.72, 28.9, LIN));
  put(document.getElementById('zone'), 780, 798, 1, zoneO, 5);
  document.getElementById('mark').style.background = t > 28 ? '#dc2828e6' : '#282828c8';

  // Khoa's new bubble and Huy's, at the new anchor on the left
  const k2y = t < 32.6 ? 456 : t < 33 ? 456 + (546 - 456) * prog(t, 32.6, 33, IO) : stackKhoa;
  put(bKhoa2, 0, k2y, pop(t, 31.2), seen(t, 31.2), 13);
  const hy = t < 32.6 ? 372 : t < 33 ? 372 + (540 - 372) * prog(t, 32.6, 33, IO) : stackHuy;
  put(bHuy, 0, hy, pop(t, 31.8), seen(t, 31.8), 14);
  const stacked = (t >= 32.75 && t < 34.5) || t >= 36.75;
  BADGE(bKhoa2, stacked ? 0 : 1);
  BADGE(bHuy, stacked ? 2 : 1);

  // Preview
  if (t < 7.6) setPreview('lan', t < 5.8 ? 'Tối nay họp lúc mấy giờ?' : 'Nhắn lại giúp mình nhé', 1404, LANY, span(t, 4.35, 7.4));
  else if (t < 12) setPreview('khoa', 'Gửi bạn file báo giá', 1404, KHOAY, span(t, 7.75, 10.8));
  else if (t < 31.8) setPreview('khoa', 'Mai gọi mình nhé', 96, 456, span(t, 31.3, 31.8, .15));
  else setPreview('huy', 'Mai mình qua lấy tài liệu', 96, 372, span(t, 31.9, 32.55, .15));

  // Panel
  const open = t >= 12.15 && t < 22.55;
  put(panel, PANELX, PANELY, .97 + .03 * prog(t, 12.15, 12.42), open ? prog(t, 12.15, 12.36) : 0, 20);
  const view = t < 19.6 ? 'A' : t < 20.8 ? 'L' : 'V';
  ['A', 'L', 'V'].forEach(v => document.getElementById('v' + v).style.visibility = v === view && open ? 'visible' : 'hidden');
  const typing = Math.floor(prog(t, 13.1, 14.8, LIN) * TYPED.length);
  const sent = t >= 15;
  document.getElementById('typed').innerHTML = sent || t < 13.1 ? '<em>Aa</em>' : TYPED.slice(0, typing);
  const s = document.getElementById('sent');
  s.style.opacity = prog(t, 15, 15.18);
  s.style.transform = `scale(${.94 + .06 * prog(t, 15, 15.25)})`;
  const r = document.getElementById('reply');
  r.style.opacity = prog(t, 16.6, 16.8);
  r.style.transform = `translateY(${8 * (1 - prog(t, 16.6, 16.85))}px)`;
  document.getElementById('r1').style.background = t > 20.3 ? '#f0f2f5' : 'transparent';

  // Tray menu
  const firstMenu = t >= 38.75 && t < 41.25, secondMenu = t >= 42.05 && t < 44.35;
  const lang = t >= 41.25 ? EN : VI;
  menu.querySelectorAll('.mi').forEach(m => {
    const i = +m.dataset.i;
    m.querySelector('span').textContent = lang[i];
    m.style.background = firstMenu && i === 6 && t > 39.45 ? '#e8ebf2' : 'transparent';
  });
  const mo = firstMenu ? prog(t, 38.75, 38.93) : secondMenu ? prog(t, 42.05, 42.23) : 0;
  const ma = firstMenu ? 38.75 : 42.05;
  put(menu, 1410, 480, .97 + .03 * prog(t, ma, ma + .2), mo, 40);
  put(sub, 1164, 790, 1, firstMenu ? prog(t, 39.7, 39.86) : 0, 41);
  document.getElementById('subEn').style.background = t > 40.4 ? '#e8ebf2' : 'transparent';

  // Cursor and clicks
  const cx = kf(t, CURSOR_X), cy = kf(t, CURSOR_Y);
  const cursor = document.getElementById('cursor');
  const hidden = t < 3.6 || t > 44.7;
  put(cursor, cx, cy, 1, hidden ? 0 : prog(t, 3.6, 3.9) * (1 - prog(t, 44.45, 44.7, LIN)), 60);
  const hit = CLICKS.find(c => t >= c && t < c + .4);
  const rip = document.getElementById('ripple');
  if (hit !== undefined) put(rip, cx, cy, .4 + .9 * prog(t, hit, hit + .4), .8 * (1 - prog(t, hit, hit + .4, LIN)), 59);
  else put(rip, 0, 0, 1, 0, 59);
};

layoutChips();

window.DURATION = 49;
